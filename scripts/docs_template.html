<script>
const $=(s,r=document)=>[...r.querySelectorAll(s)];
// copy buttons
const IC={copy:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8h12v12H8zM4 16V4h12"/></svg>',ok:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg>'};
$('pre').forEach(p=>{const w=document.createElement('div');w.className='pw';p.replaceWith(w);w.append(p);const b=document.createElement('button');b.className='cp';b.innerHTML=IC.copy;b.setAttribute('aria-label','Copy code');b.dataset.tip='Copy';b.dataset.pos='left';b.onclick=()=>{navigator.clipboard.writeText(p.innerText).then(()=>{b.innerHTML=IC.ok;b.dataset.tip='Copied';setTimeout(()=>{b.innerHTML=IC.copy;b.dataset.tip='Copy'},1400)})};w.append(b)});
// SDK / CLI filter
$('.seg button').forEach(b=>b.onclick=()=>{$('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));const k=b.dataset.k;
$('[data-kind]').forEach(e=>e.classList.toggle('hide',k!=='all'&&e.dataset.kind!=='all'&&e.dataset.kind!==k));if(k!=='all')location.hash=k==='sdk'?'python-api':'cli'});
// nav filter
$('#q').oninput=e=>{const v=e.target.value.toLowerCase();$('#side a.d,#side a.s').forEach(a=>a.classList.toggle('hide',!!v&&!a.textContent.toLowerCase().includes(v)&&!(a.classList.contains('d')&&a.parentNode.textContent.toLowerCase().includes(v))))};
// scrollspy
const links=new Map($('#side a[href^="#"]').map(a=>[a.getAttribute('href').slice(1),a]));
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(!e.isIntersecting)return;const id=e.target.id,a=links.get(id);if(!a)return;$('#side a.on').forEach(x=>x.classList.remove('on'));$('#side .cur').forEach(x=>x.classList.remove('cur'));a.classList.add('on');(a.closest('.grp')||{classList:{add(){}}}).classList.add('cur')})},{rootMargin:'0px 0px -75% 0px'});
$('section,main h2').forEach(e=>e.id&&io.observe(e));
// mobile menu, theme
const side=document.getElementById('side');const mb=document.getElementById('menu');mb.onclick=()=>{const o=side.classList.toggle('open');mb.setAttribute('aria-expanded',o)};document.getElementById('close').onclick=()=>{side.classList.remove('open');mb.setAttribute('aria-expanded',false)};
side.addEventListener('click',e=>{if(e.target.matches('a'))side.classList.remove('open')});
document.getElementById('th').onclick=()=>{const r=document.documentElement;const d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
// install picker
const pk=document.getElementById('pick');if(pk){const C={cpu:['python -m pip install "pylex-ocr[cpu] @ git+https://github.com/voltvirtuoso/pylex.git"','Works on any CPU. The recommended default.'],intel:['python -m pip install "pylex-ocr[intel] @ git+https://github.com/voltvirtuoso/pylex.git"','OpenVINO. Benchmark it against [cpu]; it is not always faster.'],g13:['python -m pip install "pylex-ocr[gpu] @ git+https://github.com/voltvirtuoso/pylex.git"','nvidia-smi reports CUDA 13 or newer. CUDA and cuDNN libraries come from pip, so no CUDA toolkit is needed.'],g12:['python -m pip install "pylex-ocr[gpu-cu12] @ git+https://github.com/voltvirtuoso/pylex.git"','nvidia-smi reports CUDA 12.x. ONNX Runtime documents that its CUDA 12.8 builds need CUDA 12.8 or newer. No CUDA toolkit needed.'],auto:['python -m pip install "pylex-ocr @ git+https://github.com/voltvirtuoso/pylex.git"\npylex doctor --install','Not sure, or Apple, AMD or TPU hardware: Pylex detects your machine and runs the right command (the CPU profile on hardware it cannot use).']};
const s=pk.querySelector('select'),c=pk.querySelector('code'),n=pk.querySelector('.n');const f=()=>{c.textContent=C[s.value][0];n.textContent=C[s.value][1]};s.onchange=f;f()}
</script>
