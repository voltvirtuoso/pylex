<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pylex documentation</title>
<meta name="description" content="Pylex: Python OCR and searchable PDFs. Python SDK and CLI documentation.">
<style>
:root{--bg:#f6f8fb;--ink:#1b2430;--mute:#5a6675;--line:#d8dee8;--nav:#0e2a47;--navink:#c9d6e6;--red:#d0342c;--link:#1d5fa8;--code:#e9eef5;--pre:#0f1b2b;--preink:#dbe6f3;
--ui:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;--serif:Charter,"Iowan Old Style","Palatino Linotype",Georgia,serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
:root:not([data-theme=light]){color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1620;--ink:#e3e9f1;--mute:#98a5b6;--line:#26323f;--nav:#0a1a2d;--link:#6fb0f0;--code:#1a2636}}
:root[data-theme=dark]{--bg:#0f1620;--ink:#e3e9f1;--mute:#98a5b6;--line:#26323f;--nav:#0a1a2d;--link:#6fb0f0;--code:#1a2636}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:20px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 var(--serif);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
a{color:var(--link)}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:2px}
#side{position:fixed;inset:0 auto 0 0;width:292px;background:var(--nav);color:var(--navink);font:14px/1.4 var(--ui);overflow-y:auto;padding:22px 16px 40px;
background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:24px 24px}
#side .brand{font:700 22px var(--ui);color:#fff;text-decoration:none;display:block;margin-bottom:2px}#side .tag{color:#8fa6c2;font-size:13px;margin-bottom:16px}
.seg{display:flex;border:1px solid #38577d;border-radius:6px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;background:none;border:0;color:var(--navink);padding:7px 4px;font:inherit;cursor:pointer}.seg button[aria-pressed=true]{background:#fff;color:var(--nav);font-weight:600}
#q{width:100%;padding:8px 10px;border-radius:6px;border:1px solid #38577d;background:#0a2038;color:#fff;font:inherit;margin-bottom:14px}#q::placeholder{color:#7f97b4}
#side h4{margin:18px 0 4px;font:600 12px var(--ui);color:#8fa6c2;letter-spacing:.02em}
#side a.d,#side a.s{display:block;color:var(--navink);text-decoration:none;padding:5px 10px 5px 12px;border-left:3px solid transparent;border-radius:0 4px 4px 0}
#side a.d{font-weight:600;color:#fff}#side a.s{padding-left:26px;font-size:13px;color:#a9bbd2;display:none}
#side .cur a.s{display:block}#side a.on{border-left-color:var(--red);background:rgba(255,255,255,.07)}#side a:hover{background:rgba(255,255,255,.1)}
#side .hide,section.hide{display:none}
#top{display:none}
main{margin-left:292px;padding:28px 40px 120px}
section{max-width:76ch;margin:0 auto;padding-bottom:56px;margin-bottom:56px;border-bottom:1px solid var(--line)}
section:last-child{border:0}
.kind{font:600 13px var(--ui);color:var(--red);margin-bottom:4px}
h1,h2,h3{font-family:var(--ui);line-height:1.2;letter-spacing:-.01em}h1{font-size:38px;margin:.1em 0 .5em}h2{font-size:26px;margin:2em 0 .6em;padding-top:.3em;border-top:1px solid var(--line)}h3{font-size:20px;margin:1.6em 0 .4em}
h1+p{font-size:19px;color:var(--mute)}
p,li{hyphens:manual}code{font:.86em var(--mono);background:var(--code);padding:.12em .35em;border-radius:4px}
.pw{position:relative}pre{background:var(--pre);color:var(--preink);padding:16px 18px;border-radius:8px;overflow-x:auto;font:14px/1.55 var(--mono);margin:1.1em 0}pre code{background:none;padding:0;font-size:inherit}
.cp{position:absolute;top:8px;right:8px;background:#22344d;color:#dbe6f3;border:1px solid #38577d;border-radius:5px;font:12px var(--ui);padding:3px 9px;cursor:pointer}
.tw{overflow-x:auto;margin:1.2em 0}table{border-collapse:collapse;font:15px/1.45 var(--ui);min-width:100%}th,td{border-bottom:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}th{border-bottom:2px solid var(--ink)}
blockquote{margin:1.2em 0;padding:.1em 1.1em;border-left:4px solid var(--red);background:var(--code);border-radius:0 6px 6px 0}
#pick{font:15px var(--ui);border:1px solid var(--line);border-left:4px solid var(--red);background:var(--code);border-radius:6px;padding:14px 16px;margin:1.4em 0}
#pick label{font-weight:600;display:block;margin-bottom:6px}#pick select{font:inherit;padding:7px;border-radius:5px;border:1px solid var(--line);background:var(--bg);color:var(--ink);max-width:100%}#pick .n{color:var(--mute);margin:8px 0 0}
#pick pre{margin:10px 0 0}
@media(max-width:860px){#side{transform:translateX(-100%);transition:transform .2s;z-index:5;width:min(88vw,320px)}#side.open{transform:none}
#top{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:4;align-items:center;gap:12px;background:var(--nav);color:#fff;font:600 16px var(--ui);padding:10px 14px}#top button{background:none;border:1px solid #38577d;color:#fff;border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
main{margin:0;padding:20px 16px 90px}h1{font-size:30px}}
</style>
</head>
<body>
<div id="top"><button id="menu" aria-label="Open navigation" aria-expanded="false">Menu</button>Pylex docs</div>
<nav id="side" aria-label="Documentation">
<a class="brand" href="#overview">Pylex</a><div class="tag">Python OCR and searchable PDFs</div>
<div class="seg" role="group" aria-label="Show documentation for"><button data-k="all" aria-pressed="true">All</button><button data-k="sdk" aria-pressed="false">Python SDK</button><button data-k="cli" aria-pressed="false">CLI</button></div>
<input id="q" type="search" placeholder="Filter pages and headings" aria-label="Filter navigation">
{{NAV}}
<p class="tag" style="margin-top:22px">Version {{VERSION}}<br><a href="https://github.com/voltvirtuoso/pylex" style="color:#8fa6c2">GitHub</a> <button id="th" style="background:none;border:0;color:#8fa6c2;cursor:pointer;font:inherit;text-decoration:underline">Toggle theme</button></p>
</nav>
<main>
{{CONTENT}}
</main>
<script>
const $=(s,r=document)=>[...r.querySelectorAll(s)];
// copy buttons
$('pre').forEach(p=>{const w=document.createElement('div');w.className='pw';p.replaceWith(w);w.append(p);const b=document.createElement('button');b.className='cp';b.textContent='Copy';b.onclick=()=>{navigator.clipboard.writeText(p.innerText).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1400)})};w.append(b)});
// SDK / CLI filter
$('.seg button').forEach(b=>b.onclick=()=>{$('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));const k=b.dataset.k;
$('[data-kind]').forEach(e=>e.classList.toggle('hide',k!=='all'&&e.dataset.kind!=='all'&&e.dataset.kind!==k));if(k!=='all')location.hash=k==='sdk'?'python-api':'cli'});
// nav filter
$('#q').oninput=e=>{const v=e.target.value.toLowerCase();$('#side a.d,#side a.s').forEach(a=>a.classList.toggle('hide',!!v&&!a.textContent.toLowerCase().includes(v)&&!(a.classList.contains('d')&&a.parentNode.textContent.toLowerCase().includes(v))))};
// scrollspy
const links=new Map($('#side a[href^="#"]').map(a=>[a.getAttribute('href').slice(1),a]));
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(!e.isIntersecting)return;const id=e.target.id,a=links.get(id);if(!a)return;$('#side a.on').forEach(x=>x.classList.remove('on'));$('#side .cur').forEach(x=>x.classList.remove('cur'));a.classList.add('on');(a.closest('.grp')||{classList:{add(){}}}).classList.add('cur')})},{rootMargin:'0px 0px -75% 0px'});
$('section,main h2').forEach(e=>e.id&&io.observe(e));
// mobile menu, theme
const side=document.getElementById('side');document.getElementById('menu').onclick=e=>{const o=side.classList.toggle('open');e.target.setAttribute('aria-expanded',o)};
side.addEventListener('click',e=>{if(e.target.matches('a'))side.classList.remove('open')});
document.getElementById('th').onclick=()=>{const r=document.documentElement;const d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0f1620';r.dataset.theme=d?'light':'dark'};
// install picker
const pk=document.getElementById('pick');if(pk){const C={cpu:['python -m pip install "pylex-ocr[cpu]"','Works on any CPU. The recommended default.'],intel:['python -m pip install "pylex-ocr[intel]"','OpenVINO. Benchmark it against [cpu]; it is not always faster.'],g13:['python -m pip install "pylex-ocr[gpu]"','nvidia-smi reports CUDA 13 or newer. CUDA and cuDNN libraries come from pip, so no CUDA toolkit is needed.'],g12:['python -m pip install "pylex-ocr[gpu-cu12]"','nvidia-smi reports CUDA 12.x. ONNX Runtime documents that its CUDA 12.8 builds need CUDA 12.8 or newer. No CUDA toolkit needed.'],auto:['python -m pip install pylex-ocr\npylex doctor --install','Not sure, or Apple, AMD or TPU hardware: Pylex detects your machine and runs the right command (the CPU profile on hardware it cannot use).']};
const s=pk.querySelector('select'),c=pk.querySelector('code'),n=pk.querySelector('.n');const f=()=>{c.textContent=C[s.value][0];n.textContent=C[s.value][1]};s.onchange=f;f()}
</script>
</body>
</html>
