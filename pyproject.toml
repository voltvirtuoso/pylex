[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pylex"
# The release version is sourced from src/pylex/__init__.py.
dynamic = ["version"]
description = "Generic Python OCR and language extraction for images and documents, with searchable PDF output and a reusable library API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Haroon" },
]
keywords = ["ocr", "text-extraction", "paddleocr", "openvino", "onnx", "pdf", "searchable-pdf", "document-processing", "computer-vision"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Text Processing",
]

dependencies = [
    "numpy>=1.24",
    "pypdfium2>=4.0",
    "pypdf>=4.0",
    "reportlab>=4.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
ocr = ["paddleocr>=3.0,<4", "paddlepaddle>=3.0,<4"]
onnx = ["onnxruntime>=1.18"]
openvino = ["onnxruntime-openvino>=1.24,<2"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/voltvirtuoso/pylex"
Issues = "https://github.com/haroon/voltvirtuoso/issues"
Changelog = "https://github.com/voltvirtuoso/pylex/blob/main/CHANGELOG.md"

[project.scripts]
pylex = "pylex.cli:main"

[tool.hatch.version]
path = "src/pylex/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pylex"]

[tool.ruff]
line-length = 110
target-version = "py310"
