[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pidocr"
version = "1.0.0"
description = "Add an invisible, searchable OCR text layer to PDFs and images — including correctly-placed OCR on rotated engineering drawings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Haroon" },
]
keywords = ["ocr", "pdf", "paddleocr", "p&id", "engineering-drawings", "searchable-pdf"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Text Processing",
]

dependencies = [
    "numpy>=1.24",
    "pypdfium2>=4.0",
    "pypdf>=4.0",
    "reportlab>=4.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
ocr = ["paddleocr>=2.7", "paddlepaddle>=2.6"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/haroon/pidocr"
Issues = "https://github.com/haroon/pidocr/issues"

[project.scripts]
pidocr = "pidocr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pidocr"]

[tool.ruff]
line-length = 110
target-version = "py310"
